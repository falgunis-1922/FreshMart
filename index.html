<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMart — Farm-Fresh Groceries, Delivered in Minutes</title>
<meta name="description" content="FreshMart: organic produce from local farms, delivered fast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

</head>

<style>
/* ============================================================
   FRESHMART — DESIGN TOKENS
   ============================================================ */
:root{
  --pine-900:#0F2E1E;
  --pine-700:#1B5C3A;
  --green-500:#2F8452;
  --green-600:#256B43;
  --sage-300:#8FC9A4;
  --mint-100:#E3F2E8;
  --cream:#FBF9F3;
  --paper:#FFFFFF;
  --ink:#152019;
  --ink-soft:#4B5A50;
  --ink-faint:#7C897F;
  --line:#DDD6C6;
  --tomato:#C6432F;
  --tomato-light:#FBE9E5;
  --wheat:#D6A93B;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:22px;
  --shadow:0 1px 2px rgba(15,46,30,0.06), 0 8px 24px -12px rgba(15,46,30,0.18);
  --display:'Fraunces', serif;
  --body:'Inter', sans-serif;
  --mono:'IBM Plex Mono', monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
ul{margin:0; padding:0; list-style:none;}
h1,h2,h3,h4{font-family:var(--display); margin:0; color:var(--pine-900); line-height:1.15;}
p{margin:0;}
:focus-visible{outline:2.5px solid var(--green-500); outline-offset:2px; border-radius:4px;}
.container{max-width:1180px; margin:0 auto; padding:0 1.5rem;}
@media (max-width:640px){.container{padding:0 1.1rem;}}
.skip-link{position:absolute; left:-999px; top:0; background:var(--pine-900); color:#fff; padding:0.75rem 1.25rem; z-index:999; border-radius:0 0 8px 0;}
.skip-link:focus{left:0;}
.eyebrow{
  font-family:var(--mono); font-size:0.7rem; font-weight:600; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--green-600); display:inline-flex; align-items:center; gap:0.4rem;
}
.section{padding:4.5rem 0;}
.section-tight{padding:2.75rem 0;}
@media (max-width:768px){.section{padding:3rem 0;}}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:0.5rem;
  padding:0.8rem 1.6rem; border-radius:100px; font-weight:700; font-size:0.88rem;
  border:1.5px solid transparent; transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--green-500); color:#fff; box-shadow:0 6px 16px -6px rgba(47,132,82,0.55);}
.btn-primary:hover{background:var(--green-600);}
.btn-outline{background:transparent; border-color:var(--pine-900); color:var(--pine-900);}
.btn-outline:hover{background:var(--pine-900); color:#fff;}
.btn-ghost{background:transparent; color:var(--pine-900); padding:0.6rem 1rem;}
.btn-ghost:hover{background:var(--mint-100);}
.btn-danger{background:var(--tomato-light); color:var(--tomato); border-color:transparent;}
.btn-danger:hover{background:var(--tomato); color:#fff;}
.btn-sm{padding:0.55rem 1.1rem; font-size:0.78rem;}
.btn-block{width:100%;}
.btn[disabled]{opacity:0.5; cursor:not-allowed;}

/* ---------- Stamp badge (signature) ---------- */
.stamp{
  display:inline-flex; align-items:center; gap:0.3rem; border:2px dashed currentColor;
  border-radius:100px; padding:0.3rem 0.7rem; transform:rotate(-4deg);
  font-family:var(--mono); font-weight:700; font-size:0.62rem; letter-spacing:0.09em; text-transform:uppercase;
}
.stamp-green{color:var(--green-600);}
.stamp-tomato{color:var(--tomato);}

/* ---------- Perforation (signature) ---------- */
.perf{
  height:11px; background-repeat:repeat-x; background-position:0 -4px; background-size:16px 11px;
  background-image:radial-gradient(circle, var(--cream) 3.6px, transparent 3.8px);
}
.perf-white{background-image:radial-gradient(circle, var(--paper) 3.6px, transparent 3.8px);}

/* ---------- Ticket / product card ---------- */
.ticket{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-m);
  overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column;
}
.product-card{position:relative;}
.product-card .thumb{aspect-ratio:1/0.85; background:var(--mint-100); overflow:hidden; position:relative;}
.product-card .thumb img{width:100%; height:100%; object-fit:cover; transition:transform 0.4s ease;}
.product-card:hover .thumb img{transform:scale(1.06);}
.product-card .thumb .stamp{position:absolute; top:0.7rem; left:0.7rem; background:rgba(255,255,255,0.92);}
.product-card .sale-tag{position:absolute; top:0.7rem; right:0.7rem; background:var(--tomato); color:#fff; font-family:var(--mono); font-weight:700; font-size:0.65rem; padding:0.25rem 0.5rem; border-radius:100px;}
.product-card .body{padding:1rem 1.1rem 1.1rem;}
.product-card h3{font-size:0.98rem; font-weight:700; margin-bottom:0.15rem;}
.product-card .weight{font-family:var(--mono); font-size:0.72rem; color:var(--ink-faint);}
.product-card .foot{display:flex; align-items:center; justify-content:space-between; margin-top:0.9rem;}
.price-now{font-family:var(--mono); font-weight:700; font-size:1.05rem; color:var(--pine-900);}
.price-was{font-family:var(--mono); font-size:0.78rem; color:var(--ink-faint); text-decoration:line-through; margin-left:0.35rem;}
.add-btn{
  width:2.4rem; height:2.4rem; border-radius:50%; border:1.5px solid var(--green-500); background:var(--mint-100);
  color:var(--green-600); display:flex; align-items:center; justify-content:center; transition:0.15s;
}
.add-btn:hover{background:var(--green-500); color:#fff;}
.qty-pill{display:flex; align-items:center; gap:0; border:1.5px solid var(--green-500); border-radius:100px; overflow:hidden;}
.qty-pill button{background:var(--mint-100); border:none; width:2.1rem; height:2.1rem; color:var(--green-600); display:flex; align-items:center; justify-content:center;}
.qty-pill button:hover{background:var(--green-500); color:#fff;}
.qty-pill span{font-family:var(--mono); font-weight:700; min-width:1.6rem; text-align:center; font-size:0.85rem;}

/* ---------- Grid helpers ---------- */
.grid{display:grid; gap:1.4rem;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:980px){.grid-4{grid-template-columns:repeat(3,1fr);} .grid-5{grid-template-columns:repeat(3,1fr);}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:repeat(2,1fr);} }
@media (max-width:420px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;}}

/* ---------- Header ---------- */
.ticker{
  background:var(--pine-900); color:var(--sage-300); font-family:var(--mono); font-size:0.72rem;
  letter-spacing:0.06em; padding:0.45rem 0; overflow:hidden; white-space:nowrap;
}
.ticker span{display:inline-block; padding-right:3.5rem; animation:scroll 22s linear infinite;}
@keyframes scroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;}}
.site-header{position:sticky; top:0; z-index:60; background:var(--pine-900); border-bottom:1px solid rgba(255,255,255,0.1);}
.nav-row{display:flex; align-items:center; justify-content:space-between; padding:0.9rem 0; gap:1rem;}
.logo{display:flex; align-items:center; gap:0.55rem; font-family:var(--display); font-weight:800; font-size:1.35rem; color:#fff;}
.logo .mark{width:2.15rem; height:2.15rem; border-radius:8px; background:var(--green-500); color:#fff; display:flex; align-items:center; justify-content:center; transform:rotate(-6deg);}
.nav-links{display:flex; align-items:center; gap:1.9rem; font-weight:600; font-size:0.88rem;}
.nav-links a{color:rgba(255,255,255,0.78); position:relative; padding:0.3rem 0;}
.nav-links a:hover, .nav-links a.active{color:#fff;}
.nav-links a.active::after{content:''; position:absolute; left:0; right:0; bottom:-4px; height:2px; background:var(--sage-300); border-radius:2px;}
.nav-actions{display:flex; align-items:center; gap:0.85rem;}
.icon-btn{position:relative; width:2.5rem; height:2.5rem; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; border:1px solid rgba(255,255,255,0.28); background:rgba(255,255,255,0.06);}
.icon-btn:hover{background:rgba(255,255,255,0.16); border-color:rgba(255,255,255,0.5);}
.badge-count{position:absolute; top:-4px; right:-4px; background:var(--tomato); color:#fff; font-size:0.62rem; font-weight:700; min-width:1.15rem; height:1.15rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); border:2px solid var(--pine-900);}
.avatar-chip{width:2.5rem; height:2.5rem; border-radius:50%; background:var(--mint-100); color:var(--pine-900); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.8rem; font-family:var(--display); border:2px solid rgba(255,255,255,0.35);}
.site-header .btn-outline{border-color:rgba(255,255,255,0.6); color:#fff;}
.site-header .btn-outline:hover{background:#fff; color:var(--pine-900);}
.menu-toggle{display:none; background:none; border:1px solid rgba(255,255,255,0.35); color:#fff; border-radius:8px; width:2.5rem; height:2.5rem; align-items:center; justify-content:center;}
@media (max-width:900px){
  .nav-links{position:fixed; inset:60px 0 0 0; background:var(--pine-900); flex-direction:column; align-items:flex-start; padding:1.5rem 1.5rem; gap:0.4rem; transform:translateY(-8px); opacity:0; pointer-events:none; transition:0.2s; border-top:1px solid rgba(255,255,255,0.12); z-index:59;}
  .nav-links a{padding:0.85rem 0.25rem; width:100%; border-bottom:1px solid rgba(255,255,255,0.12); font-size:1rem; color:rgba(255,255,255,0.85);}
  .nav-links a:hover, .nav-links a.active{color:#fff;}
  header.nav-open .nav-links{opacity:1; pointer-events:auto; transform:translateY(0);}
  .menu-toggle{display:flex;}
}

/* ---------- Footer ---------- */
.site-footer{background:var(--pine-900); color:var(--sage-300); margin-top:5rem;}
.site-footer a{color:#EAF3EC;}
.site-footer a:hover{color:var(--sage-300);}
.footer-grid{display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr; gap:2.5rem; padding:3.5rem 0 2.5rem;}
@media (max-width:768px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer-grid h5{font-family:var(--mono); font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--sage-300); margin-bottom:1rem;}
.footer-grid li{margin-bottom:0.55rem; font-size:0.87rem; color:#CFE3D6;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.12); padding:1.25rem 0; display:flex; justify-content:space-between; align-items:center; font-size:0.78rem; color:#9DB8A8; flex-wrap:wrap; gap:0.75rem;}

/* ---------- Forms ---------- */
.field{margin-bottom:1.15rem; display:flex; flex-direction:column; gap:0.4rem;}
.field label{font-size:0.78rem; font-weight:700; color:var(--pine-900);}
.field input, .field select, .field textarea{
  border:1.5px solid var(--line); background:var(--paper); border-radius:var(--radius-s);
  padding:0.72rem 0.9rem; font-family:var(--body); font-size:0.9rem; color:var(--ink); width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--green-500);}
.check-row{display:flex; align-items:center; gap:0.55rem; font-size:0.83rem; color:var(--ink-soft);}
.radio-card{display:flex; align-items:center; gap:0.75rem; border:1.5px solid var(--line); border-radius:var(--radius-s); padding:0.85rem 1.1rem; background:var(--paper); cursor:pointer;}
.radio-card.selected{border-color:var(--green-500); background:var(--mint-100);}
.auth-shell{max-width:440px; margin:0 auto; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-l); padding:2.6rem 2.4rem; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.auth-shell::before{content:''; position:absolute; top:0; left:0; right:0; height:6px; background:repeating-linear-gradient(90deg,var(--green-500) 0 14px, transparent 14px 22px);}

/* ---------- Table (admin) ---------- */
.data-table{width:100%; border-collapse:collapse; font-size:0.85rem;}
.data-table th{text-align:left; font-family:var(--mono); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-faint); padding:0.85rem 1rem; border-bottom:1.5px solid var(--line);}
.data-table td{padding:0.9rem 1rem; border-bottom:1px solid var(--line); vertical-align:middle;}
.data-table tr:hover td{background:var(--mint-100);}
.pill{display:inline-flex; align-items:center; padding:0.28rem 0.7rem; border-radius:100px; font-size:0.7rem; font-weight:700; font-family:var(--mono); text-transform:uppercase;}
.pill-processing{background:#FFF3DA; color:var(--wheat);}
.pill-delivered{background:var(--mint-100); color:var(--green-600);}
.pill-cancelled{background:var(--tomato-light); color:var(--tomato);}
.pill-active{background:var(--mint-100); color:var(--green-600);}

/* ---------- misc ---------- */
.hairline{border:none; border-top:1px solid var(--line); margin:1.5rem 0;}
.muted{color:var(--ink-soft);}
.toast{position:fixed; bottom:1.5rem; right:1.5rem; background:var(--pine-900); color:#fff; padding:0.9rem 1.4rem; border-radius:var(--radius-s); font-size:0.85rem; font-weight:600; box-shadow:0 12px 30px -8px rgba(0,0,0,0.4); opacity:0; transform:translateY(12px); transition:0.25s; pointer-events:none; z-index:200; display:flex; align-items:center; gap:0.6rem;}
.toast.show{opacity:1; transform:translateY(0);}
.breadcrumb{display:flex; gap:0.5rem; align-items:center; font-size:0.8rem; font-weight:600; color:var(--ink-faint); margin-bottom:1.5rem;}
.breadcrumb a{color:var(--green-600);}
.empty-state{text-align:center; padding:4rem 1.5rem; background:var(--paper); border:1.5px dashed var(--line); border-radius:var(--radius-m);}

/* ---------- Modal (admin product form) ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,32,25,0.55); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:3rem 1.2rem; overflow-y:auto; z-index:300;}
.modal-box{background:var(--paper); border-radius:var(--radius-l); width:100%; max-width:560px; box-shadow:0 24px 60px -20px rgba(0,0,0,0.4); overflow:hidden;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:1.4rem 1.7rem; border-bottom:1px solid var(--line);}
.modal-head h2{font-size:1.2rem;}
.modal-close{width:2.2rem; height:2.2rem; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--mint-100); color:var(--pine-900); border:none;}
.modal-close:hover{background:var(--sage-300);}
.modal-body{padding:1.6rem 1.7rem; max-height:70vh; overflow-y:auto;}
.modal-foot{display:flex; justify-content:flex-end; gap:0.75rem; padding:1.2rem 1.7rem; border-top:1px solid var(--line); background:var(--cream);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}

/* ---------- Responsive layout overrides (mobile) ---------- */
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr !important; gap:1.8rem !important;}
  .hero-grid img{height:220px !important;}
  .pdp-grid{grid-template-columns:1fr !important;}
  .catalog-grid{grid-template-columns:1fr !important; padding-top:1.4rem !important;}
  .catalog-grid aside{position:static !important; top:auto !important; display:flex !important; overflow-x:auto; gap:0.3rem; padding:0.7rem !important;}
  .catalog-grid aside h4{display:none;}
  .catalog-grid aside a{flex-shrink:0; white-space:nowrap;}
  .split-grid{grid-template-columns:1fr !important;}
  .profile-grid{grid-template-columns:1fr !important;}
  .split-grid > div:last-child, .profile-grid > div:last-child{position:static !important; top:auto !important;}
  .admin-shell{flex-direction:column !important; min-height:auto !important;}
  .admin-sidebar{width:100% !important; height:auto !important; position:relative !important; flex-direction:row !important; align-items:center; padding:0.5rem 0.7rem; gap:0.6rem;}
  .admin-sidebar > div:first-child{padding:0.4rem 0.2rem !important; flex-shrink:0;}
  .admin-sidebar nav{flex:none !important; display:flex !important; overflow-x:auto; padding:0.2rem !important; gap:0.3rem;}
  .admin-sidebar nav a{white-space:nowrap; margin-bottom:0 !important;}
  .admin-sidebar > div:last-child{padding:0.4rem 0.2rem !important; flex-shrink:0;}
  .admin-content{padding:1.4rem 1.1rem 2.5rem !important;}
}
@media (max-width:640px){
  .modal-backdrop{padding:1rem 0.7rem !important; align-items:center !important;}
  .modal-body{padding:1.1rem 1.2rem !important;}
  .modal-head, .modal-foot{padding:1rem 1.2rem !important;}
  .data-table th, .data-table td{padding:0.6rem 0.65rem; font-size:0.78rem;}
  .auth-shell{padding:2rem 1.4rem !important;}
}
@media (max-width:480px){
  h1{font-size:1.4rem;}
  .grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;}

}

/* Login Success Popup */

.popup-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:fadeIn .3s ease;
}

.popup-box{
    background:#fff;
    width:360px;
    max-width:90%;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    animation:popup .35s ease;
}

.success-icon{
    font-size:60px;
    margin-bottom:15px;
}

.popup-box h2{
    color:#28a745;
    margin-bottom:10px;
}

.popup-box p{
    color:#555;
    line-height:1.6;
    margin-bottom:25px;
}

.popup-box button{
    background:#28a745;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.popup-box button:hover{
    background:#1e7e34;
}

@keyframes popup{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}
</style>

const STORAGE_KEY = 'freshmart-db-v1';

function persistData(){
  try {
    const snapshot = {
      products: PRODUCTS,
      state: {
        ...state,
        openOrders: Array.from(state.openOrders || []),
      },
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
  } catch (error) {
    console.warn('FreshMart persistence save failed:', error);
  }

  persistSupabaseData();
  persistSupabaseProfiles();
}

function getSupabaseClient(){
  if (supabaseClient) return supabaseClient;

  const url = (SUPABASE_CONFIG.url || '').trim();
  const anonKey = (SUPABASE_CONFIG.anonKey || '').trim();

  if (!url || !anonKey || url.includes('your-project') || anonKey.includes('your-anon-key')) {
    return null;
  }

  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    console.warn('Supabase SDK was not loaded. Check the network connection or script tag.');
    return null;
  }

  supabaseClient = window.supabase.createClient(url, anonKey);
  return supabaseClient;
}

function normalizeProductRow(item){
  return {
    id: Number(item.id ?? 0),
    cat: item.category || 'fruit',
    name: item.name || 'Untitled product',
    weight: item.weight || '',
    price: Number(item.price || 0),
    was: item.was != null ? Number(item.was) : undefined,
    rating: Number(item.rating || 0),
    reviews: Number(item.reviews || 0),
    stock: Number(item.stock || 0),
    img: item.image_url || '',
    gallery: Array.isArray(item.gallery) ? item.gallery : (item.gallery ? [item.gallery] : []),
    desc: item.description || ''
  };
}

function toSupabaseProduct(product){
  return {
    id: product.id,
    category: product.cat,
    name: product.name,
    weight: product.weight,
    price: product.price,
    was: product.was ?? null,
    rating: product.rating,
    reviews: product.reviews,
    stock: product.stock,
    image_url: product.img,
    gallery: product.gallery || [],
    description: product.desc
  };
}

async function persistSupabaseData(){
  const client = getSupabaseClient();
  if (!client) return;

  try {
    await client.from('products').upsert(PRODUCTS.map(toSupabaseProduct), { onConflict: 'id' });
  } catch (error) {
    console.warn('Supabase products sync failed:', error);
  }
}

async function deleteSupabaseProduct(id){
  const client = getSupabaseClient();
  if (!client) return;

  try {
    const { error } = await client.from('products').delete().eq('id', id);
    if (error) throw error;
  } catch (error) {
    console.warn('Supabase product delete failed:', error);
    toast('Deleted locally, but Supabase sync failed — check console', 'alert-triangle');
  }
}

function normalizeProfileRow(item){
  return {
    name: item.name || 'Unnamed',
    email: item.email || '',
    phone: item.phone || '',
    address: item.address || '',
    password: item.password || '',
    joined: item.joined || 'Recently',
    status: item.status || 'Active'
  };
}

function toSupabaseProfile(user){
  return {
    name: user.name,
    email: user.email,
    phone: user.phone || '',
    address: user.address || '',
    password: user.password,
    joined: user.joined || 'Recently',
    status: user.status || 'Active'
  };
}

async function persistSupabaseProfiles(){
  const client = getSupabaseClient();
  if (!client || !state.registeredUsers.length) return;

  try {
    await client.from('app_users').upsert(state.registeredUsers.map(toSupabaseProfile), { onConflict: 'email' });
  } catch (error) {
    console.warn('Supabase profiles sync failed:', error);
  }
}

async function hydrateData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      persistData();
    } else {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed.products)) {
        PRODUCTS.splice(0, PRODUCTS.length, ...parsed.products);
      }

      if (parsed.state) {
        state = {
          ...state,
          ...parsed.state,
          cart: Array.isArray(parsed.state.cart) ? parsed.state.cart : state.cart,
          orders: Array.isArray(parsed.state.orders) ? parsed.state.orders : state.orders,
          users: Array.isArray(parsed.state.users) ? parsed.state.users : state.users,
          registeredUsers: Array.isArray(parsed.state.registeredUsers) ? parsed.state.registeredUsers : state.registeredUsers,
          openOrders: new Set(Array.isArray(parsed.state.openOrders) ? parsed.state.openOrders : []),
          currentUser: parsed.state.currentUser || null,
          adminUser: parsed.state.adminUser || null,
          promo: Number(parsed.state.promo) || 0,
          activeThumb: Number.isInteger(parsed.state.activeThumb) ? parsed.state.activeThumb : state.activeThumb,
          paymentMethod: parsed.state.paymentMethod || state.paymentMethod,
          nextProductId: Number.isInteger(parsed.state.nextProductId) ? parsed.state.nextProductId : state.nextProductId,
        };
      }
    }
  } catch (error) {
    console.warn('FreshMart persistence load failed:', error);
  }

  const client = getSupabaseClient();
  if (!client) return;

  try {
    const { data, error } = await client.from('products').select('*').order('id', { ascending: true });
    if (error) throw error;
    if (Array.isArray(data) && data.length) {
      PRODUCTS.splice(0, PRODUCTS.length, ...data.map(normalizeProductRow));
      persistData();
    } else {
      await client.from('products').upsert(PRODUCTS.map(toSupabaseProduct), { onConflict: 'id' });
    }
  } catch (error) {
    console.warn('Supabase sync skipped:', error);
  }

  try {
    const { data: profileRows, error: profileError } = await client.from('app_users').select('*').order('email', { ascending: true });
    if (profileError) throw profileError;

    if (Array.isArray(profileRows) && profileRows.length) {
      const merged = profileRows.map(normalizeProfileRow);
      // keep any account created on this device that hasn't synced yet
      state.registeredUsers.forEach(local => {
        if (!merged.some(m => m.email.toLowerCase() === local.email.toLowerCase())) merged.push(local);
      });
      state.registeredUsers = merged;

      // reflect newly-known accounts in the admin "Manage Users" list
      merged.forEach(p => {
        if (!state.users.some(u => u.email.toLowerCase() === p.email.toLowerCase())) {
          state.users.push({ name: p.name, email: p.email, joined: p.joined, orders: 0, status: p.status });
        }
      });
      persistData();
    } else if (state.registeredUsers.length) {
      await client.from('app_users').upsert(state.registeredUsers.map(toSupabaseProfile), { onConflict: 'email' });
    }
  } catch (error) {
    console.warn('Supabase profile sync skipped:', error);
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  await hydrateData();
  render();
});

const catLink = (cat,icon,label,active) => `<a href="#/${cat==='fruit'?'fruits':'vegetables'}" style="display:flex; align-items:center; gap:0.6rem; padding:0.75rem 1.2rem; font-weight:600; font-size:0.88rem; border-left:3px solid ${active===cat?'var(--green-500)':'transparent'}; color:${active===cat?'var(--green-600)':'var(--ink)'}; background:${active===cat?'var(--mint-100)':'transparent'};"><i data-lucide="${icon}" style="width:16px;height:16px;"></i>${label}</a>`;

/* ============================================================
   PAGE: PRODUCT DETAILS
   ============================================================ */

  return `
  <div class="container" style="padding:2rem 0 4.5rem;">
    <div class="breadcrumb"><a href="#/home">Home</a><i data-lucide="chevron-right" style="width:12px;height:12px;"></i><a href="#/${p.cat==='fruit'?'fruits':'vegetables'}">${p.cat==='fruit'?'Fruits':'Vegetables'}</a><i data-lucide="chevron-right" style="width:12px;height:12px;"></i><span>${p.name}</span></div>
    <div class="grid grid-2 pdp-grid" style="gap:3.5rem; align-items:start; margin-bottom:4rem;">
      <div>

          <img src="${activeImg}" alt="${p.name}" style="max-height:340px; object-fit:contain;">

        ${p.gallery.length>1 ? `<div style="display:flex; gap:0.8rem; margin-top:1rem; justify-content:center;">
          ${p.gallery.map((g,i)=>`<button data-action="thumb" data-i="${i}" style="width:64px;height:64px;padding:3px;border-radius:10px;border:2px solid ${i===state.activeThumb?'var(--green-500)':'var(--line)'};background:#fff;overflow:hidden;"><img src="${g}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;"></button>`).join('')}

      <div>
        <span class="stamp stamp-green">Premium selection</span>
        <h1 style="font-size:2.1rem; margin-top:0.7rem;">${p.name}</h1>
        <p class="muted" style="margin-top:0.3rem;">${p.weight}</p>
        <div style="display:flex; align-items:center; gap:1.2rem; padding:1.1rem 0; margin:1rem 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);">
          <span style="display:flex; align-items:center; gap:0.3rem; font-weight:700;"><i data-lucide="star" style="width:15px;height:15px; fill:var(--wheat); color:var(--wheat);"></i>${p.rating} <span class="muted" style="font-weight:500;">(${p.reviews} reviews)</span></span>
          <span class="stamp stamp-tomato">9 min delivery</span>
        </div>
        <div class="ticket" style="flex-direction:row; align-items:center; justify-content:space-between; padding:1.4rem 1.6rem; margin-bottom:1.4rem;">
          <div><span class="price-now" style="font-size:1.8rem;">${money(p.price)}</span>${p.was?`<span class="price-was">${money(p.was)}</span>`:''}</div>
          <button class="btn btn-primary" data-action="add" data-id="${p.id}">Add to cart</button>
        </div>
        <div class="grid grid-3" style="gap:0.8rem;">
          ${miniTrust('shield-check','Fast delivery','9–15 minutes to your door')}
          ${miniTrust('sparkles','Fresh assured','From certified organic growers')}
          ${miniTrust('refresh-cw','Easy returns','Hand back at the door')}
        </div>
        <div style="margin-top:1.6rem;">
          <h3 style="font-size:1.05rem; margin-bottom:0.5rem;">Product details</h3>
          <p class="muted" style="line-height:1.7;">${p.desc}</p>
        </div>
      </div>
    </div>
    <section>
      <h2 style="font-size:1.3rem; margin-bottom:1.3rem;">People also shopped for</h2>
      <div class="grid grid-5">${related.map(productCard).join('')}</div>
    </section>
  </div>`;
}
const miniTrust = (icon,title,body) => `<div style="background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-s); padding:0.9rem; text-align:center;"><i data-lucide="${icon}" style="width:20px;height:20px; color:var(--green-500);"></i><h5 style="font-size:0.78rem; font-weight:700; margin-top:0.5rem;">${title}</h5><p class="muted" style="font-size:0.68rem; margin-top:0.2rem;">${body}</p></div>`;

/* ============================================================
   PAGE: CART
   ============================================================ */
function pageCart(){

    return `<div class="container" style="padding:3rem 0 5rem;"><div class="empty-state">
      <i data-lucide="shopping-basket" style="width:34px;height:34px; color:var(--green-500);"></i>

    </div></div>`;
  }
  return `
  <div class="container" style="padding:2.2rem 0 4.5rem;">
    <h1 style="font-size:1.8rem;">My Shopping Cart</h1>
    <p class="muted" style="margin-top:0.3rem; font-size:0.85rem;">Confirm items and proceed to secure checkout.</p>
    <div class="grid split-grid" style="grid-template-columns:2fr 1fr; gap:2.5rem; align-items:start; margin-top:1.8rem;">
      <div style="display:flex; flex-direction:column; gap:1.1rem;">
        ${lines.map(l=>`
        <div class="ticket" style="flex-direction:row; align-items:center; gap:1.3rem; padding:1.1rem; flex-wrap:wrap;">
          <img src="${l.product.img}" alt="${l.product.name}" style="width:4.5rem; height:4.5rem; object-fit:cover; border-radius:var(--radius-s);">
          <div style="flex:1; min-width:140px;">
            <h4 style="font-size:0.95rem; font-weight:700;">${l.product.name}</h4>
            <p class="muted" style="font-size:0.78rem; margin-top:0.2rem;">${l.product.weight} · ${money(l.product.price)}/unit</p>
          </div>
          <div class="qty-pill">
            <button data-action="dec" data-id="${l.product.id}"><i data-lucide="minus" style="width:13px;height:13px;"></i></button>

            <button data-action="inc" data-id="${l.product.id}"><i data-lucide="plus" style="width:13px;height:13px;"></i></button>
          </div>
          <span style="font-family:var(--mono); font-weight:700; min-width:60px; text-align:right;">${money(l.product.price*l.qty)}</span>
          <button class="icon-btn" data-action="remove" data-id="${l.product.id}" aria-label="Remove" style="border-color:transparent;"><i data-lucide="trash-2" style="width:16px;height:16px; color:var(--ink-faint);"></i></button>
        </div>`).join('')}
      </div>
      <div style="display:flex; flex-direction:column; gap:1.4rem;">
        <div class="ticket" style="padding:1.4rem;">
          <label style="font-size:0.72rem; font-weight:800; text-transform:uppercase; color:var(--ink-faint); font-family:var(--mono);">Promo code</label>
          <div style="display:flex; gap:0.5rem; margin-top:0.6rem;">
            <input type="text" id="promoInput" placeholder="e.g. FRESH20" class="field" style="border:1.5px solid var(--line); border-radius:var(--radius-s); padding:0.6rem 0.8rem; text-transform:uppercase; flex:1;">
            <button class="btn btn-outline btn-sm" data-action="promo">Apply</button>
          </div>
          <p style="font-size:0.72rem; color:var(--green-600); font-weight:700; margin-top:0.6rem;">Use FRESH20 for 20% off your subtotal.</p>
        </div>
        <div class="ticket" style="padding:1.6rem;">
          <h3 style="font-size:1.05rem; border-bottom:1px solid var(--line); padding-bottom:0.8rem; margin-bottom:1rem;">Bill details</h3>
          ${billRow('Item subtotal', money(cartSubtotal()))}
          ${billRow('Delivery charge', 'FREE', true)}
          ${state.promo>0 ? billRow('Discount applied', '−'+money(discountAmt()), false, true) : ''}
          <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:1rem; padding-top:1rem; border-top:1px solid var(--line);">
            <span style="font-weight:800;">Total</span>
            <span style="font-family:var(--mono); font-weight:800; font-size:1.5rem; color:var(--green-600);">${money(cartTotal())}</span>
          </div>
          <a href="#/checkout" class="btn btn-primary btn-block" style="margin-top:1.2rem;">Proceed to checkout <i data-lucide="chevron-right" style="width:15px;height:15px;"></i></a>

}
const billRow = (label,val,green,red) => `<div style="display:flex; justify-content:space-between; font-size:0.88rem; padding:0.4rem 0; color:${red?'var(--tomato)':'var(--ink-soft)'};"><span>${label}</span><span style="font-weight:700; font-family:var(--mono); color:${green?'var(--green-600)':red?'var(--tomato)':'var(--ink)'};">${val}</span></div>`;

/* ============================================================
   PAGE: CHECKOUT
   ============================================================ */
const DELIVERY_SLOTS = [
  {val:'express', label:'Express (ready in 9 minutes)', icon:'zap'},
  {val:'morning', label:'Morning (7 AM – 11 AM)', icon:'sunrise'},
  {val:'afternoon', label:'Afternoon (12 PM – 4 PM)', icon:'sun'},
  {val:'evening', label:'Evening (5 PM – 9 PM)', icon:'sunset'},
];
const slotLabel = v => (DELIVERY_SLOTS.find(s=>s.val===v) || DELIVERY_SLOTS[0]).label;

function pageCheckout(){
  const lines = cartLines();
  if(!lines.length){ go('/cart'); return ''; }
  const step = state.checkoutStep || 1;
  return `
  <div class="container" style="padding:2.2rem 0 4.5rem; max-width:660px;">
    <div class="ticket" style="padding:0;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:1.4rem 1.8rem; border-bottom:1px solid var(--line);">
        <h2 style="font-size:1.3rem; display:flex; align-items:center; gap:0.6rem;"><i data-lucide="shopping-bag" style="width:20px;height:20px; color:var(--green-500);"></i>Checkout</h2>
        <a href="#/cart" aria-label="Close checkout" style="width:2rem; height:2rem; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);"><i data-lucide="x" style="width:18px;height:18px;"></i></a>
      </div>
      <div style="display:flex; background:var(--cream); border-bottom:1px solid var(--line);">
        ${checkoutTab(1,'Delivery',step)}
        ${checkoutTab(2,'Payment',step)}
        ${checkoutTab(3,'Review',step)}
      </div>
      <div style="padding:1.8rem;">
        ${step===1 ? checkoutStepDelivery() : step===2 ? checkoutStepPayment(lines) : checkoutStepReview(lines)}
      </div>
    </div>
  </div>`;
}

const checkoutTab = (n,label,current) => {
  const state_ = current===n ? 'active' : current>n ? 'done' : 'todo';
  const color = state_==='active' ? 'var(--green-600)' : state_==='done' ? 'var(--ink-soft)' : 'var(--ink-faint)';
  return `<button type="button" class="checkout-tab" data-action="checkout-goto" data-step="${n}" ${current<n?'disabled':''}
    style="flex:1; padding:1rem 0.5rem; text-align:center; background:none; border:none; font-family:var(--mono); font-size:0.72rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:${color}; border-bottom:2px solid ${state_==='active'?'var(--green-500)':'transparent'}; cursor:${current>=n?'pointer':'default'};">
    ${n} · ${label}</button>`;
};

function checkoutStepDelivery(){
  const d = state.checkoutData;
  const u = state.currentUser;
  const nameParts = (u && !d.firstName) ? u.name.split(' ') : [];
  const firstName = d.firstName || nameParts[0] || '';
  const lastName = d.lastName || nameParts.slice(1).join(' ') || '';
  const email = d.email || (u ? u.email : '');
  const phone = d.phone || (u ? u.phone : '') || '';
  const street = d.street || (u ? u.address : '') || '';
  return `
  <form data-action="checkout-step1">
    <span class="eyebrow"><i data-lucide="package" style="width:13px;height:13px;"></i> Contact &amp; delivery details</span>
    <div class="grid grid-2" style="margin-top:1.1rem;">
      ${field('First name','text','Falguni', firstName, {id:'co-first', required:true})}
      ${field('Last name','text','Sharma', lastName, {id:'co-last', required:true})}
    </div>
    ${field('Email','email','you@example.com', email, {id:'co-email', required:true})}
    ${field('Phone number','tel','+91 98765 43210', phone, {id:'co-phone', required:true})}
    ${field('Street address','text','House no., street name, area', street, {id:'co-street', required:true})}
    <div class="grid grid-2">
      ${field('City','text','City', d.city, {id:'co-city', required:true})}
      ${field('ZIP / PIN code','text','ZIP code', d.zip, {id:'co-zip', required:true})}
    </div>
    <div class="field">
      <label>Delivery instructions <span class="muted" style="text-transform:none; font-weight:500;">(optional)</span></label>
      <textarea id="co-notes" rows="2" style="border:1.5px solid var(--line); border-radius:var(--radius-s); padding:0.72rem 0.9rem; width:100%; resize:none; font-family:var(--body);" placeholder="Ring the bell twice, leave at door, etc.">${d.notes||''}</textarea>
    </div>
    <span class="eyebrow" style="margin-top:0.6rem; display:inline-flex;"><i data-lucide="truck" style="width:13px;height:13px;"></i> Delivery slot</span>
    <div class="field" style="margin-top:0.6rem;">
      <select id="co-slot" style="border:1.5px solid var(--line); border-radius:var(--radius-s); padding:0.72rem 0.9rem; width:100%; font-family:var(--body); font-size:0.9rem;">
        ${DELIVERY_SLOTS.map(s=>`<option value="${s.val}" ${d.slot===s.val?'selected':''}>${s.label}</option>`).join('')}
      </select>
    </div>
    <div style="display:flex; gap:0.8rem; margin-top:1.4rem;">
      <a href="#/cart" class="btn btn-outline" style="flex:1;"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Back to cart</a>
      <button type="submit" class="btn btn-primary" style="flex:2;">Continue to payment <i data-lucide="arrow-right" style="width:15px;height:15px;"></i></button>
    </div>
  </form>`;
}

function checkoutStepPayment(lines){
  return `
  <form data-action="checkout-step2">
    ${orderSummaryBlock(lines)}
    <span class="eyebrow" style="margin-top:1.4rem; display:inline-flex;"><i data-lucide="credit-card" style="width:13px;height:13px;"></i> Payment method</span>
    <div style="display:flex; flex-direction:column; gap:0.7rem; margin-top:0.7rem;">
      ${paymentOption('cod','Cash on Delivery','banknote','Pay when your order arrives at your door')}
      ${paymentOption('upi','UPI','smartphone','Google Pay, PhonePe, Paytm, BHIM')}
      ${paymentOption('card','Credit / Debit Card','credit-card','Visa, Mastercard, RuPay')}
    </div>
    ${state.paymentMethod==='card' ? `
    <div class="grid grid-2" style="margin-top:1.2rem; padding-top:1.2rem; border-top:1px solid var(--line);">
      <div style="grid-column:span 2;">${field('Card number','text','4111 2222 3333 4444','',{id:'co-card', required:true})}</div>
      ${field('Expiration','text','MM/YY','',{id:'co-exp', required:true})}
      ${field('CVV','password','123','',{id:'co-cvv', required:true})}
    </div>` : ''}
    <div style="display:flex; gap:0.8rem; margin-top:1.4rem;">
      <button type="button" class="btn btn-outline" data-action="checkout-back" style="flex:1;"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Back</button>
      <button type="submit" class="btn btn-primary" style="flex:2;">Review order <i data-lucide="arrow-right" style="width:15px;height:15px;"></i></button>
    </div>
  </form>`;
}

function checkoutStepReview(lines){
  const d = state.checkoutData;
  const payLabel = state.paymentMethod==='card' ? 'Credit / Debit Card' : state.paymentMethod==='upi' ? 'UPI' : 'Cash on Delivery';
  const payIcon = state.paymentMethod==='card' ? 'credit-card' : state.paymentMethod==='upi' ? 'smartphone' : 'banknote';
  return `
  <form data-action="place-order">
    ${orderSummaryBlock(lines)}
    <span class="eyebrow" style="margin-top:1.4rem; display:inline-flex;"><i data-lucide="map-pin" style="width:13px;height:13px;"></i> Delivery details</span>
    <div style="background:var(--cream); border-radius:var(--radius-s); padding:1rem 1.2rem; margin-top:0.7rem; display:flex; flex-direction:column; gap:0.55rem; font-size:0.86rem;">
      ${reviewRow('Name', `${d.firstName} ${d.lastName}`)}
      ${reviewRow('Email', d.email)}
      ${reviewRow('Phone', d.phone)}
      ${reviewRow('Address', `${d.street}, ${d.city} – ${d.zip}`)}
      ${reviewRow('Delivery slot', slotLabel(d.slot))}
      ${d.notes ? reviewRow('Notes', d.notes) : ''}
    </div>
    <span class="eyebrow" style="margin-top:1.2rem; display:inline-flex;"><i data-lucide="credit-card" style="width:13px;height:13px;"></i> Payment</span>
    <div style="background:var(--cream); border-radius:var(--radius-s); padding:1rem 1.2rem; margin-top:0.7rem;">
      ${reviewRow('Method', payLabel, payIcon)}
    </div>
    <div style="display:flex; gap:0.8rem; margin-top:1.4rem;">
      <button type="button" class="btn btn-outline" data-action="checkout-back" style="flex:1;"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Back</button>
      <button type="submit" class="btn btn-primary" style="flex:2;">Place order (${money(cartTotal())}) <i data-lucide="shield-check" style="width:15px;height:15px;"></i></button>
    </div>
  </form>`;
}

const reviewRow = (label,val,icon) => `<div style="display:flex; justify-content:space-between; gap:1rem;"><span class="muted">${label}</span><span style="font-weight:700; text-align:right; display:flex; align-items:center; gap:0.4rem;">${icon?`<i data-lucide="${icon}" style="width:14px;height:14px; color:var(--green-500);"></i>`:''}${val}</span></div>`;

function orderSummaryBlock(lines){
  return `
  <div style="background:var(--cream); border-radius:var(--radius-s); padding:1.2rem;">
    <h4 style="font-size:0.95rem; display:flex; align-items:center; gap:0.5rem; margin-bottom:0.9rem;"><i data-lucide="shopping-cart" style="width:16px;height:16px; color:var(--green-500);"></i>Order summary (${lines.reduce((s,l)=>s+l.qty,0)} items)</h4>
    <div style="display:flex; flex-direction:column; gap:0.55rem; max-height:170px; overflow-y:auto;">
      ${lines.map(l=>`<div style="display:flex; justify-content:space-between; align-items:center; font-size:0.85rem; gap:0.6rem;">
        <span style="display:flex; align-items:center; gap:0.6rem; min-width:0;"><img src="${l.product.img}" style="width:1.8rem;height:1.8rem;border-radius:5px;object-fit:cover;flex-shrink:0;">
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${l.product.name}</span></span>
        <span style="white-space:nowrap; font-family:var(--mono); font-weight:700;">x${l.qty} &nbsp;${money(l.product.price*l.qty)}</span>
      </div>`).join('')}
    </div>
    <div style="margin-top:0.9rem; padding-top:0.8rem; border-top:1px solid var(--line);">
      ${billRow('Subtotal', money(cartSubtotal()))}
      ${billRow('Delivery', 'FREE', true)}
      ${state.promo>0 ? billRow('Discount', '−'+money(discountAmt()), false, true) : ''}
    </div>
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:0.7rem; padding-top:0.7rem; border-top:1px solid var(--line);">
      <span style="font-weight:800;">Grand total</span>
      <span style="font-family:var(--mono); font-weight:800; font-size:1.3rem; color:var(--green-600);">${money(cartTotal())}</span>
    </div>
  </div>`;

            <div class="field-row">
              <div class="field"><label for="pPrice">Price ($)</label><input type="number" id="pPrice" step="0.01" min="0" placeholder="2.99" value="${p.price ?? ''}" required></div>
              <div class="field"><label for="pWas">Was price ($) — optional</label><input type="number" id="pWas" step="0.01" min="0" placeholder="3.49" value="${p.was ?? ''}"></div>
            </div>
            <div class="field-row">
              <div class="field"><label for="pStock">Stock quantity</label><input type="number" id="pStock" min="0" placeholder="120" value="${p.stock ?? ''}" required></div>
              <div class="field"><label for="pRating">Rating (0–5)</label><input type="number" id="pRating" step="0.1" min="0" max="5" placeholder="4.8" value="${p.rating ?? ''}"></div>
            </div>
            <div class="field"><label for="pImg">Image URL</label><input type="url" id="pImg" placeholder="https://images.unsplash.com/..." value="${p.img || ''}" required></div>
            <div class="field"><label for="pDesc">Description</label><textarea id="pDesc" rows="3" style="resize:none; border:1.5px solid var(--line); border-radius:var(--radius-s); padding:0.72rem 0.9rem; width:100%; font-family:inherit; font-size:0.9rem;" placeholder="Short product description...">${p.desc || ''}</textarea></div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-outline btn-sm" data-action="close-modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm">${isEdit ? 'Save changes' : 'Add product'}</button>
          </div>
        </form>
      </div>
    </div>`;
}

function openProductModal(id){
  const product = id ? findProduct(id) : null;
  document.getElementById('modal-root').innerHTML = productModalHTML(product);
  lucide.createIcons();
  document.getElementById('pName').focus();
}

function closeProductModal(){
  document.getElementById('modal-root').innerHTML = '';
}

function pageAdminOrders(){
  const content = `
    <h1 style="font-size:1.7rem;">Manage Orders</h1>
    <p class="muted" style="font-size:0.85rem; margin-top:0.3rem;">${state.orders.length} orders placed.</p>
    <div class="ticket" style="padding:0; margin-top:1.6rem; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
        <tbody>${state.orders.map(o=>`
          <tr>
            <td style="font-family:var(--mono); font-weight:700;">${o.id}</td>
            <td class="muted">${o.date}</td>
            <td class="muted">${o.items.length} item(s)</td>
            <td style="font-family:var(--mono);">${money(o.total)}</td>
            <td>
              <select data-action="admin-order-status" data-id="${o.id}" style="border:1px solid var(--line); border-radius:100px; padding:0.4rem 0.9rem; font-size:0.78rem; font-weight:700; font-family:var(--mono);">
                ${['Processing','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  return adminShell('/admin/orders', content);
}

function pageAdminUsers(){
  const content = `
    <h1 style="font-size:1.7rem;">Manage Users</h1>
    <p class="muted" style="font-size:0.85rem; margin-top:0.3rem;">${state.users.length} registered customers.</p>
    <div class="ticket" style="padding:0; margin-top:1.6rem; overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Orders</th><th>Status</th><th></th></tr></thead>
        <tbody>${state.users.map((u,i)=>`
          <tr>
            <td style="font-weight:700;">${u.name}</td>
            <td class="muted">${u.email}</td>
            <td class="muted">${u.joined}</td>
            <td>${u.orders}</td>
            <td><span class="pill ${u.status==='Active'?'pill-active':'pill-cancelled'}">${u.status}</span></td>
            <td style="text-align:right;"><button class="btn btn-ghost btn-sm" data-action="admin-toggle-user" data-i="${i}">${u.status==='Active'?'Suspend':'Reactivate'}</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  return adminShell('/admin/users', content);
}

function page404(){
  return `<div class="container" style="padding:5rem 0; text-align:center;"><h1 style="font-size:2rem;">Page not found</h1><a href="#/home" class="btn btn-primary" style="margin-top:1.2rem;">Back home</a></div>`;
}

/* ============================================================
   ROUTER
   ============================================================ */
function currentPath(){
  let h = location.hash.slice(1) || '/home';
  if(h === '/') h = '/home';
  return h;
}
function render(){
  const path = currentPath();
  let html = '';
  if(path === '/home') html = pageHome();
  else if(path === '/login') html = pageLogin();
  else if(path === '/register') html = pageRegister();
  else if(path === '/fruits') html = pageCatalog('fruit');
  else if(path === '/vegetables') html = pageCatalog('vegetable');
  else if(path.startsWith('/product/')) html = pageProduct(path.split('/')[2]);
  else if(path === '/cart') html = pageCart();
  else if(path === '/checkout') html = pageCheckout();
  else if(path === '/orders') html = pageOrders();
  else if(path === '/profile'){
    if(!state.currentUser){ toast('Please sign in to view your account', 'lock'); go('/login'); return; }
    html = pageProfile();
  }
  else if(path === '/about') html = pageAbout();
  else if(path === '/contact') html = pageContact();
  else if(path === '/admin/login') html = pageAdminLogin();
  else if(path === '/admin/dashboard') html = pageAdminDashboard();
  else if(path === '/admin/products') html = pageAdminProducts();
  else if(path === '/admin/orders') html = pageAdminOrders();
  else if(path === '/admin/users') html = pageAdminUsers();
  else html = page404();

  document.getElementById('app').innerHTML = html;
  renderHeader();
  renderFooter();
  lucide.createIcons();
  persistData();
  window.scrollTo(0,0);
}

/* ============================================================
   EVENTS (delegated)
   ============================================================ */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action === 'toggle-menu'){
    document.getElementById('siteHeader').classList.toggle('nav-open');
    return;
  }
  if(action === 'add'){
    if(!state.currentUser){
      toast('Please sign in to add items to your cart', 'lock');
      go('/login');
      return;
    }
    const id = +t.dataset.id;
    const existing = state.cart.find(i=>i.productId===id);
    if(existing) existing.qty++; else state.cart.push({productId:id, qty:1});
    persistData();
    toast('Added to cart', 'shopping-basket');
    render();
  }
  if(action === 'inc'){
    const id = +t.dataset.id;
    state.cart.find(i=>i.productId===id).qty++;
    persistData();
    render();
  }
  if(action === 'dec'){
    const id = +t.dataset.id;
    const item = state.cart.find(i=>i.productId===id);
    item.qty--; if(item.qty<=0) state.cart = state.cart.filter(i=>i.productId!==id);
    persistData();
    render();
  }
  if(action === 'remove'){
    state.cart = state.cart.filter(i=>i.productId!== +t.dataset.id);
    persistData();
    toast('Item removed', 'trash-2');
    render();
  }
  if(action === 'promo'){
    const val = document.getElementById('promoInput').value.trim().toUpperCase();
    if(val === 'FRESH20'){ state.promo = 0.20; toast('Promo applied — 20% off!', 'tag'); }
    else { state.promo = 0; toast('Invalid promo code', 'x-circle'); }
    persistData();
    render();
  }
  if(action === 'thumb'){ state.activeThumb = +t.dataset.i; render(); }
  if(action === 'toggle-order'){
    const id = t.dataset.id;
    state.openOrders.has(id) ? state.openOrders.delete(id) : state.openOrders.add(id);
    persistData();
    render();
  }
  if(action === 'logout'){ state.currentUser = null; persistData(); toast('Logged out'); go('/login'); }
  if(action === 'admin-logout'){ state.adminUser = null; persistData(); go('/admin/login'); }
  if(action === 'payment'){ state.paymentMethod = t.dataset.val; persistData(); render(); }
  if(action === 'checkout-back'){
    state.checkoutStep = Math.max(1, (state.checkoutStep||1) - 1);
    render();
  }
  if(action === 'checkout-goto'){
    const n = +t.dataset.step;
    if(n <= (state.checkoutStep||1)) { state.checkoutStep = n; render(); }
  }
  if(action === 'admin-delete-product'){
    const id = +t.dataset.id;
    if(!confirm('Delete this product? This cannot be undone.')) return;
    const idx = PRODUCTS.findIndex(p=>p.id===id);
    if(idx>-1) PRODUCTS.splice(idx,1);
    persistData();
    deleteSupabaseProduct(id);
    toast('Product removed');
    render();
  }
  if(action === 'admin-edit-product'){ openProductModal(+t.dataset.id); }
  if(action === 'admin-add-product'){ openProductModal(null); }
  if(action === 'close-modal'){ closeProductModal(); }
  if(action === 'admin-toggle-user'){
    const i = +t.dataset.i;
    state.users[i].status = state.users[i].status==='Active' ? 'Suspended' : 'Active';
    persistData();
    render();
  }
});

document.addEventListener('change', e=>{
  if(e.target.dataset.action === 'admin-order-status'){
    const o = state.orders.find(x=>x.id===e.target.dataset.id);
    o.status = e.target.value;
    persistData();
    toast(`${o.id} marked ${o.status}`);
    render();
  }
});

document.addEventListener('submit', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  e.preventDefault();
  const action = t.dataset.action;

  if(action === 'login'){
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;
    const match = state.registeredUsers.find(u => u.email.toLowerCase() === email && u.password === password);
    if(match){
      state.currentUser = match;
      persistData();
      showLoginPopup();
    } else if(state.registeredUsers.some(u => u.email.toLowerCase() === email)){
      toast('Incorrect password. Try again.', 'alert-circle');
    } else {
      toast('No account found for that email — please register first.', 'alert-circle');
    }
  }
  if(action === 'register'){
    const name = document.getElementById('registerName').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const phone = document.getElementById('registerPhone').value.trim();
    const address = document.getElementById('registerAddress').value.trim();
    const password = document.getElementById('registerPassword').value;
    const confirm = document.getElementById('registerConfirm').value;
    if(password !== confirm){ toast('Passwords do not match', 'alert-circle'); return; }
    if(password.length < 6){ toast('Password must be at least 6 characters', 'alert-circle'); return; }
    if(state.registeredUsers.some(u => u.email.toLowerCase() === email.toLowerCase())){
      toast('An account with this email already exists — please sign in.', 'alert-circle');
      return;
    }
    const newUser = {name, email, phone, address, password, joined:'Today', status:'Active'};
    state.registeredUsers.push(newUser);
    state.users.push({name, email, joined:'Today', orders:0, status:'Active'});
    persistData();
    toast('Account created — please sign in.', 'check-circle');
    go('/login');
  }
  if(action === 'save-profile'){
    const nameInput = t.querySelector('input[type="text"]');
    const phoneInput = t.querySelector('input[type="tel"]');
    const addressInput = t.querySelector('textarea');
    if(state.currentUser){
      state.currentUser.name = nameInput.value.trim() || state.currentUser.name;
      state.currentUser.phone = phoneInput.value.trim();
      state.currentUser.address = addressInput.value.trim();
      persistData();
    }
    toast('Profile updated', 'check-circle');
    render();
  }
  if(action === 'contact'){ toast('Message sent — we will reply shortly.'); t.reset(); }
  if(action === 'admin-login'){
    const email = document.getElementById('adminEmail').value.trim().toLowerCase();
    const password = document.getElementById('adminPassword').value;
    if(email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password){
      state.adminUser = {name:'Admin'};
      persistData();
      toast('Welcome, Admin', 'check-circle');
      go('/admin/dashboard');
    } else {
      toast('Incorrect admin email or password', 'alert-circle');
    }
  }
  if(action === 'save-product'){
    const name = document.getElementById('pName').value.trim();
    const cat = document.getElementById('pCat').value;
    const weight = document.getElementById('pWeight').value.trim();
    const price = parseFloat(document.getElementById('pPrice').value);
    const wasRaw = document.getElementById('pWas').value;
    const stock = parseInt(document.getElementById('pStock').value, 10);
    const ratingRaw = document.getElementById('pRating').value;
    const img = document.getElementById('pImg').value.trim();
    const desc = document.getElementById('pDesc').value.trim();

    if(!name || !img || isNaN(price) || isNaN(stock)){
      toast('Please fill in all required fields', 'alert-circle');
      return;
    }

    const editId = t.dataset.id ? +t.dataset.id : null;

    if(editId){
      const p = findProduct(editId);
      if(p){
        Object.assign(p, {
          name, cat, weight, price,
          was: wasRaw !== '' ? parseFloat(wasRaw) : undefined,
          stock,
          rating: ratingRaw !== '' ? parseFloat(ratingRaw) : 0,
          img, gallery:[img], desc
        });
      }
      toast('Product updated', 'check-circle');
    } else {
      const newId = state.nextProductId++;
      PRODUCTS.push({
        id: newId, cat, name, weight, price,
        was: wasRaw !== '' ? parseFloat(wasRaw) : undefined,
        rating: ratingRaw !== '' ? parseFloat(ratingRaw) : 0,
        reviews: 0, stock, img, gallery:[img], desc
      });
      toast('Product added', 'check-circle');
    }

    persistData();
    closeProductModal();
    render();
  }
  if(action === 'checkout-step1'){
    state.checkoutData = {
      firstName: document.getElementById('co-first').value.trim(),
      lastName: document.getElementById('co-last').value.trim(),
      email: document.getElementById('co-email').value.trim(),
      phone: document.getElementById('co-phone').value.trim(),
      street: document.getElementById('co-street').value.trim(),
      city: document.getElementById('co-city').value.trim(),
      zip: document.getElementById('co-zip').value.trim(),
      notes: document.getElementById('co-notes').value.trim(),
      slot: document.getElementById('co-slot').value,
    };
    state.checkoutStep = 2;
    render();
  }
  if(action === 'checkout-step2'){
    state.checkoutStep = 3;
    render();
  }
  if(action === 'place-order'){
    const d = state.checkoutData;
    const id = 'ORD-' + Math.floor(1000 + Math.random()*8999);
    state.orders.unshift({
      id, date:'Just now', status:'Processing',
      items: cartLines().map(l=>({name:l.product.name, qty:l.qty, price:l.product.price*l.qty})),
      total: cartTotal(), address:`${d.firstName} ${d.lastName} · ${d.street}, ${d.city} – ${d.zip}`,
      payment: state.paymentMethod==='card'?'Credit / Debit Card':state.paymentMethod==='upi'?'UPI':'Cash on Delivery',
      slot: slotLabel(d.slot),
    });
    state.cart = []; state.promo = 0;
    state.checkoutStep = 1;
    state.checkoutData = { firstName:'', lastName:'', email:'', phone:'', street:'', city:'', zip:'', notes:'', slot:'express' };
    persistData();
    toast('Order placed successfully!', 'check-circle');
    go('/orders');
  }
});

window.addEventListener('hashchange', render);
</script>
</body>
</html>
